<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Smart Parking</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5fbff, #e5f4ff);
        color: #1e3a5f;
        padding: 20px;
    }

    .forgot-card {
        width: 100%;
        max-width: 580px;
        background: #ffffff;
        border: 1px solid #b9dcf8;
        border-radius: 28px;
        padding: 52px 44px;
        box-shadow: 0 20px 60px rgba(45, 140, 200, 0.12);
        text-align: center;
    }

    .logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 25px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #4db4e8, #278ed0);
        color: white;
        font-size: 38px;
        font-weight: bold;
        box-shadow: 0 10px 30px rgba(45, 150, 215, 0.20);
    }

    h1 {
        font-size: 36px;
        margin-bottom: 10px;
        color: #1e3a5f;
    }

    .subtitle {
        color: #7188a3;
        font-size: 18px;
        line-height: 1.5;
        margin-bottom: 36px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 24px;
    }

    label {
        display: block;
        margin-bottom: 10px;
        font-size: 16px;
        color: #1e3a5f;
    }

    input {
        width: 100%;
        padding: 18px 20px;
        border-radius: 14px;
        border: 1px solid #c6e0f5;
        background: #f6faff;
        color: #1e3a5f;
        outline: none;
        font-size: 16px;
    }

    input:focus {
        border-color: #45a9e0;
        box-shadow: 0 0 10px rgba(69, 169, 224, 0.18);
    }

    input::placeholder {
        color: #8da6c0;
    }

    .reset-btn {
        width: 100%;
        border: none;
        border-radius: 13px;
        padding: 19px;
        margin-top: 12px;
        background: linear-gradient(135deg, #4db4e8, #278ed0);
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .reset-btn:hover {
        box-shadow: 0 8px 22px rgba(45, 150, 215, 0.30);
        transform: translateY(-2px);
    }

    .login-link {
        display: inline-block;
        margin-top: 28px;
        color: #278ed0;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
    }

    .login-link:hover {
        color: #176da8;
    }

    .home-link {
        display: inline-block;
        margin-top: 22px;
        color: #7188a3;
        text-decoration: none;
        font-size: 15px;
    }

    .home-link:hover {
        color: #278ed0;
    }

    @media (max-width: 480px) {
        .forgot-card {
            padding: 32px 22px;
        }

        h1 {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

    <div class="forgot-card">

        <div class="logo">P</div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Reset your Smart Parking account password
        </p>

        <form method="POST" action="/forgot-password">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button type="submit" class="reset-btn">
                Reset Password
            </button>

        </form>

        <a href="/login" class="login-link">
            ← Back to Login
        </a>

        <br>

        <a href="/" class="home-link">
            ← Back to Home
        </a>

    </div>

</body>
</html>
